version: "3.8"

services:
  app:
    build: .
    container_name: projectmanagement-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - pm-network

  nginx:
    image: nginx:alpine
    container_name: projectmanagement-nginx
    restart: unless-stopped
    ports:
      - "3003:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pm-network

  db:
    image: mysql:8.0
    container_name: projectmanagement-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: project_management_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: project_management
      MYSQL_PASSWORD: Adshfg@123
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pm-network

volumes:
  dbdata:

networks:
  pm-network:
