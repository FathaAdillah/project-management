version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /var/www

    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini

    networks:
      - laravel-network

    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  nginx:
    image: nginx:alpine

    ports:
      - "8000:80"

    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/

    depends_on:
      - app

    networks:
      - laravel-network

    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  db:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}

    ports:
      - "${DB_PORT}:3306"

    volumes:
      - laravel-data:/var/lib/mysql

    networks:
      - laravel-network

    deploy:
      restart_policy:
        condition: unless-stopped

networks:
  laravel-network:
    driver: bridge

volumes:
  laravel-data:
