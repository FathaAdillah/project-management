services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www # Sinkronisasi code
    depends_on:
      - db
    networks:
      - laravel-network

  nginx:
    ports:
      - "8001:80"
    image: nginx:alpine # Pakai image standar, tidak perlu Dockerfile.nginx lagi
    volumes:
      - .:/var/www # Nginx mengintip folder yang sama dengan App
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf # Pasang config
    depends_on:
      - app
    networks:
      - laravel-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel-network

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - laravel-network

networks:
  laravel-network:

volumes:
  mysql-data:
